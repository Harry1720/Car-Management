<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../../assets/images/tab_logo.png" type="image/x-icon">
    <title>Đăng Nhập Quản Lý</title>
    
    <link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css" />
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
    
    <link rel="stylesheet" href="../../assets/css/user_pages/login.css">
    

</head>
    <script src="../../assets/js/user/login.js"> </script>

<body>
    <div class="navbar">
        <a href="../../pages/user/index.html">
            <img src="../../assets/images/vinlogo.png" alt="VINFAST" class="logo">
        </a>
    </div>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card mt-5" style="width: max-content; margin-left: 10px;">
                    <div class="card-header text-center">
                        <h3>Đăng Nhập</h3>
                    </div>
                    <div class="card-body">
                        <div class="subtittle">(Chỉ dành cho Nhân viên Quản lý Đại lý)</div>
                        <form id="login-form">
                            <div class="form-group">
                                <i class="fas fa-user"></i>
                                <label for="username">Tên đăng nhập</label>
                                <input type="text" id="username" name="username" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <i class="fas fa-key"></i>
                                <label for="password">Mật khẩu</label>
                                <input type="password" id="password" name="password" class="form-control" required>
                            </div>
                            <button type="button" onclick = "login()" class="btn btn-primary btn-block">ĐĂNG NHẬP</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

    </div>
</body>
</html>
