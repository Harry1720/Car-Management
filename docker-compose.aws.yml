version: '3.8'

services:
  mongo:
    image: mongo:latest
    container_name: car_mongo
    restart: always
    volumes:
      - mongo_data:/data/db
    networks:
      - car_network

  backend:
    build: ./be
    container_name: car_backend
    restart: always
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/car-management
    depends_on:
      - mongo
    networks:
      - car_network

  frontend:
    build:
      context: ./car-management-react
      args:
        - VITE_API_BASE_URL=http://54.224.139.231/api
    container_name: car_frontend
    restart: always
    networks:
      - car_network

  nginx:
    image: nginx:alpine
    container_name: car_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.aws.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - car_network

networks:
  car_network:
    driver: bridge

volumes:
  mongo_data:
